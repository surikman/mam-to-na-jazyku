<pre id="out">running</pre>
<iframe id="f" src="about:blank" style="width:375px;height:667px"></iframe>
<script>
var log=[];function L(s){log.push(s);}
function done(){document.getElementById("out").textContent=log.join("\n");}
// starý formát uloženej hry (bez rounds/over)
localStorage.clear();
var f=document.getElementById("f"); f.src="index.html";
f.onload=function(){
  var w=f.contentWindow,d=w.document,$=function(i){return d.getElementById(i);};
  var errs=[];w.addEventListener("error",function(e){errs.push(e.message);});
  function sel(s){return d.querySelector("#actions "+s);}
  function labels(){return [].map.call(d.querySelectorAll("#actions button"),function(b){return b.textContent;}).join(" / ");}
  var steps=[
   function(){ L("summary: "+$("moreSum").textContent+" | rounds out: "+d.querySelector('[data-key=rounds] output').textContent);
     // 1 kolo pre rýchly test konca hry
     d.querySelector('[data-key=rounds] button[data-d="-1"]').click(); d.querySelector('[data-key=rounds] button[data-d="-1"]').click();d.querySelector('[data-key=rounds] button[data-d="-1"]').click();d.querySelector('[data-key=rounds] button[data-d="-1"]').click();
     L("rounds now: "+d.querySelector('[data-key=rounds] output').textContent+" saved: "+JSON.parse(w.localStorage.getItem("uhadni-co-pocujes-v2")).settings.rounds);
     $("startBtn").click(); },
   function(){ L("prep: "+$("tag").textContent+" | "+$("main").textContent+" | "+$("sub").textContent+" | turn: "+$("turnLab").textContent+" / "+$("readLab").textContent+" | "+$("roundCount").textContent);
     // dvojklik na Štart do 100 ms
     sel(".btn.primary").click(); var t=w.performance.now(); setTimeout(function(){ var b=sel(".btn.primary")||sel(".btn"); L("2nd click target: "+(b&&b.textContent)); b && b.click(); },100); },
   function(){ L("after dbl: "+$("card").className+" | buttons: "+labels()); if($("card").className.indexOf("c-hint")>-1){ L("hint tag: "+$("tag").textContent); sel(".btn.primary").click(); } },
   function(){ L("phon: "+$("card").className+" | "+labels()); },
   function(){ // pauza cez Skóre
     $("scoreBtn").click(); L("score title: "+$("resTitle").textContent); },
   function(){},function(){},
   function(){ $("backBtn").click(); },
   function(){ sel(".btn.primary").click(); },
   function(){ L("judge time (should be ~1 s, not ~3 s): "+$("main").textContent+" | "+labels()); sel(".btn.ok").click(); },
   function(){ L("green: "+$("sub").textContent+" | "+labels()); sel(".btn.primary").click(); },
   function(){ L("2nd turn: "+$("roundCount").textContent+" | "+$("turnLab").textContent+" reads "+$("readLab").textContent); sel(".btn.primary").click(); },
   function(){ if($("card").className.indexOf("c-hint")>-1) sel(".btn.primary").click(); },
   function(){ sel(".btn.small").click(); /* vzdávame sa */ },
   function(){ L("red: "+$("card").className+" | "+labels()); sel(".btn.primary").click(); },
   function(){ L("results: "+$("resTitle").textContent+" | "+$("resLead").textContent+" | back hidden: "+$("backBtn").classList.contains("hidden")+" | log: "+$("log").textContent.slice(0,80)); $("newBtn").click(); },
   function(){ L("resume visible: "+!$("resumeBtn").classList.contains("hidden")); $("cardsBtn").click(); },
   function(){ var a=d.querySelector(".crow .ans"); L("spoiler: "+a.className); a.click(); L("after tap: "+a.className); L("errors: "+JSON.stringify(errs)); done(); }
  ];
  var i=0;(function run(){ try{steps[i++]();}catch(e){L("EXC step "+(i-1)+": "+e.message);done();return;} if(i<steps.length) setTimeout(run,700); })();
};
</script>
